<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https://qzlunjuvettnfzyctqog.supabase.co; base-uri 'none'; form-action 'none'">
  <title>Confirm your Pact account · BlackAndBlue</title>
  <script>
    const query = new URLSearchParams(location.search);
    let tokenHash = query.get("token_hash");
    const kind = query.get("type");
    const linkError = query.has("error");
    history.replaceState(null, "", location.pathname);
    addEventListener("DOMContentLoaded", () => {
      const title = document.querySelector("#title");
      const message = document.querySelector("#message");
      const confirm = document.querySelector("#confirm");
      const setStatus = (heading, detail) => {
        title.textContent = heading;
        message.textContent = detail;
      };

      if (linkError) {
        setStatus("This link could not be completed", "It may have expired or already been used. Request a fresh email in Pact, or contact support below.");
      } else if (tokenHash && kind === "email") {
        setStatus("Confirm your Pact account", "For your security, this link will not activate until you press the button below.");
        confirm.hidden = false;
      } else {
        setStatus("Open a fresh email link", "This page needs a valid Pact sign-up link. Request a new confirmation email in the app.");
      }

      confirm.addEventListener("click", async () => {
        confirm.disabled = true;
        setStatus("Confirming your email…", "Please keep this page open for a moment.");
        try {
          const response = await fetch("https://qzlunjuvettnfzyctqog.supabase.co/auth/v1/verify", {
            method: "POST",
            headers: {
              "apikey": "sb_publishable_7wnt9l60sPJX2Z-L1dJe-A_ZxiXBBde",
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ token_hash: tokenHash, type: kind }),
            cache: "no-store",
            referrerPolicy: "no-referrer"
          });
          if (!response.ok) throw new Error("Verification failed");
          tokenHash = null;
          confirm.hidden = true;
          setStatus("Email confirmed", "Return to Pact and sign in with the email and password you chose in the app.");
        } catch (_) {
          confirm.hidden = true;
          setStatus("This link could not be completed", "It may have expired or already been used. Request a fresh email in Pact, or contact support below.");
        }
      });
    });
  </script>
  <style>
    :root { color-scheme: light; font-family: ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { background: #fbf9f8; color: #292c29; margin: 0; min-height: 100vh; }
    main { margin: 0 auto; max-width: 38rem; padding: clamp(2rem, 8vw, 5rem) 1.5rem; }
    .brand { align-items: center; display: flex; gap: .8rem; font-size: .88rem; font-weight: 750; letter-spacing: .11em; text-transform: uppercase; }
    .brand img { border-radius: 15px; height: 48px; width: 48px; }
    .card { background: white; border: 1px solid #eee5df; border-radius: 24px; box-shadow: 0 16px 50px #3d2a160d; margin-top: 2rem; padding: clamp(1.5rem, 6vw, 3rem); }
    .eyebrow { color: #a34e32; font-size: .78rem; font-weight: 750; letter-spacing: .13em; text-transform: uppercase; }
    h1 { font-size: clamp(2rem, 7vw, 3rem); letter-spacing: -.045em; line-height: 1.12; margin: 1rem 0; }
    p { color: #505a51; font-size: 1.04rem; line-height: 1.65; }
    button { background: #99472f; border: 0; border-radius: 12px; color: white; cursor: pointer; font: inherit; font-weight: 700; min-height: 48px; padding: .8rem 1.25rem; }
    button:disabled { cursor: wait; opacity: .65; }
    button:focus-visible, a:focus-visible { outline: 3px solid #4a654f; outline-offset: 3px; }
    .help { border-top: 1px solid #eee5df; font-size: .9rem; margin-top: 2rem; padding-top: 1rem; }
    a { color: #99472f; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="blackandblue-mark.png" width="48" height="48" alt="BlackAndBlue logo"> BlackAndBlue <span aria-hidden="true">/</span> Pact</div>
    <section class="card" aria-live="polite">
      <div class="eyebrow">Account security</div>
      <h1 id="title">Checking your link</h1>
      <p id="message">Please wait a moment.</p>
      <button id="confirm" type="button" hidden>Confirm email and continue</button>
      <p class="help">Didn’t expect this email? You can safely close this page. BlackAndBlue will never ask you to reply with your password or email link. Need help? <a href="mailto:developer@blackandblue.co.in?subject=Pact%20account%20help">Contact support</a>.</p>
    </section>
  </main>
</body>
</html>
